[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix-signalroom"
version = "0.1.0"
description = "IncuBrix Signal Room — The Evidence-First Search & AI Visibility Intelligence Engine"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
signalroom = "signalroom.cli.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_api_key: tests that need a live external API key",
    "slow: tests that take > 5 seconds",
    "hard_case: hard-case edge/failure scenarios",
    "integration: requires running Docker services",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
