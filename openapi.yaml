openapi: 3.1.0
info:
  title: SceneForge AI
  description: Script and Voiceover to B-roll Video Engine. IncuBrix Software Engineer Assessment - PS3.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Liveness check
      description: Returns 200 if the API process is alive.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - health
      summary: Readiness check
      description: Returns 200 if all dependencies are reachable.
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /jobs:
    post:
      tags:
      - jobs
      summary: Create Job
      description: 'Create a new video generation job.

        Idempotency: supply `Idempotency-Key` header. Duplicate requests with the
        same key and equivalent payload return the existing job (HTTP 200).
        Same key + different payload returns HTTP 409.'
      operationId: create_job_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - jobs
      summary: List Jobs
      description: Return a list of recent jobs ordered by creation time descending.
      operationId: list_jobs_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobStatusResponse'
                title: Response List Jobs Jobs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/upload-audio:
    post:
      tags:
      - jobs
      summary: Upload Audio
      description: Upload voiceover audio file for a job.
      operationId: upload_audio_jobs_upload_audio_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_audio_jobs_upload_audio_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Upload Audio Jobs Upload Audio Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get Job
      operationId: get_job_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/storyboard:
    get:
      tags:
      - jobs
      summary: Get Storyboard
      operationId: get_storyboard_jobs__job_id__storyboard_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/artifacts:
    get:
      tags:
      - jobs
      summary: List Artifacts
      operationId: list_artifacts_jobs__job_id__artifacts_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/artifacts/{filename}:
    get:
      tags:
      - jobs
      summary: Download Artifact
      description: Returns a presigned redirect to the artifact in MinIO.
      operationId: download_artifact_jobs__job_id__artifacts__filename__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/cancel:
    post:
      tags:
      - jobs
      summary: Cancel Job
      operationId: cancel_job_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      tags:
      - health
      summary: Liveness check
      description: Returns 200 if the API process is alive.
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ready:
    get:
      tags:
      - health
      summary: Readiness check
      description: Returns 200 if all dependencies are reachable.
      operationId: ready_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/jobs:
    post:
      tags:
      - jobs
      summary: Create Job
      description: 'Create a new video generation job.

        Idempotency: supply `Idempotency-Key` header. Duplicate requests with the
        same key and equivalent payload return the existing job (HTTP 200).
        Same key + different payload returns HTTP 409.'
      operationId: create_job_api_v1_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/upload-audio:
    post:
      tags:
      - jobs
      summary: Upload Audio
      description: Upload voiceover audio file for a job.
      operationId: upload_audio_api_v1_jobs_upload_audio_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_audio_api_v1_jobs_upload_audio_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Upload Audio Api V1 Jobs Upload Audio Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get Job
      operationId: get_job_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/storyboard:
    get:
      tags:
      - jobs
      summary: Get Storyboard
      operationId: get_storyboard_api_v1_jobs__job_id__storyboard_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/artifacts:
    get:
      tags:
      - jobs
      summary: List Artifacts
      operationId: list_artifacts_api_v1_jobs__job_id__artifacts_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/artifacts/{filename}:
    get:
      tags:
      - jobs
      summary: Download Artifact
      description: Returns a presigned redirect to the artifact in MinIO.
      operationId: download_artifact_api_v1_jobs__job_id__artifacts__filename__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/cancel:
    post:
      tags:
      - jobs
      summary: Cancel Job
      operationId: cancel_job_api_v1_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /files/{bucket}/{path}:
    get:
      tags:
      - files
      summary: Download a stored artifact
      description: Serve a stored artifact from the filesystem.
      operationId: get_file_files__bucket___path__get
      parameters:
      - name: bucket
        in: path
        required: true
        schema:
          type: string
          title: Bucket
      - name: path
        in: path
        required: true
        schema:
          type: string
          title: Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ArtifactListResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        artifacts:
          items:
            type: string
          type: array
          title: Artifacts
      type: object
      required:
      - job_id
      - artifacts
      title: ArtifactListResponse
      description: Response for GET /jobs/{id}/artifacts.
    Body_upload_audio_api_v1_jobs_upload_audio_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_audio_api_v1_jobs_upload_audio_post
    Body_upload_audio_jobs_upload_audio_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_audio_jobs_upload_audio_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
        environment:
          type: string
          title: Environment
      type: object
      required:
      - status
      - version
      - environment
      title: HealthResponse
    JobCreateRequest:
      properties:
        script:
          anyOf:
          - type: string
            maxLength: 100000
          - type: 'null'
          title: Script
          description: Narration script text. Required unless voiceover is supplied.
        voiceover_path:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Voiceover Path
          description: Path to uploaded voiceover audio file.
        aspect_ratio:
          type: string
          pattern: ^(16:9|9:16|1:1)$
          title: Aspect Ratio
          description: 'Output video aspect ratio: 16:9 | 9:16 | 1:1.'
          default: '16:9'
        burn_captions:
          type: boolean
          title: Burn Captions
          description: Whether to burn captions directly into the video.
          default: false
        tts_adapter:
          type: string
          title: Tts Adapter
          description: 'TTS adapter to use: mock | edge_tts | coqui'
          default: mock
        stt_adapter:
          type: string
          title: Stt Adapter
          description: 'STT adapter to use: mock | whisper'
          default: mock
        stock_provider:
          type: string
          title: Stock Provider
          description: 'Stock footage provider: mock | pexels | pixabay'
          default: mock
        callback_url:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Callback Url
          description: Webhook URL for job completion callbacks.
        config:
          anyOf:
          - type: object
          - type: 'null'
          title: Config
          description: Optional extra rendering configuration.
      type: object
      title: JobCreateRequest
      description: Request body for POST /jobs.
    JobCreateResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        progress:
          type: number
          title: Progress
          default: 0.0
        result_links:
          additionalProperties:
            type: string
          type: object
          title: Result Links
        created_at:
          type: string
          format: date-time
          title: Created At
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
      type: object
      required:
      - job_id
      - status
      - created_at
      title: JobCreateResponse
      description: Response for POST /jobs (new job created) following Integration Standard IS-03.
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        retryable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Retryable
        retry_count:
          type: integer
          title: Retry Count
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        queued_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Queued At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        aspect_ratio:
          type: string
          title: Aspect Ratio
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
      type: object
      required:
      - job_id
      - status
      - created_at
      - updated_at
      - aspect_ratio
      title: JobStatusResponse
      description: Response for GET /jobs/{id}.
    ReadyResponse:
      properties:
        status:
          type: string
          title: Status
        checks:
          additionalProperties:
            type: string
          type: object
          title: Checks
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
    SceneResponse:
      properties:
        scene_id:
          type: string
          title: Scene Id
        scene_index:
          type: integer
          title: Scene Index
        narration_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Narration Text
        start_time:
          anyOf:
          - type: number
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: number
          - type: 'null'
          title: End Time
        visual_concept:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Concept
        suggested_visual_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Suggested Visual Type
        route:
          anyOf:
          - type: string
          - type: 'null'
          title: Route
        asset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Id
        relevance_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Relevance Score
        caption_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Caption Text
        status:
          type: string
          title: Status
        qa_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Qa Status
        plan_data:
          anyOf:
          - type: object
          - type: 'null'
          title: Plan Data
      type: object
      required:
      - scene_id
      - scene_index
      - narration_text
      - start_time
      - end_time
      - visual_concept
      - suggested_visual_type
      - route
      - asset_id
      - relevance_score
      - caption_text
      - status
      - qa_status
      - plan_data
      title: SceneResponse
      description: A single scene entry in the storyboard.
    StoryboardResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        job_status:
          type: string
          title: Job Status
        scenes:
          items:
            $ref: '#/components/schemas/SceneResponse'
          type: array
          title: Scenes
      type: object
      required:
      - job_id
      - job_status
      - scenes
      title: StoryboardResponse
      description: Response for GET /jobs/{id}/storyboard.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
